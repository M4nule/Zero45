[project]
name = "zero45"
version = "0.1.0"
description = "Zero45 – energy transition planning game for groups (Germany 2030–2045), PyPSA + HiGHS + NiceGUI"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Manuel Lerschmacher" }]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pypsa>=1.0",
    "highspy>=1.10",
    "nicegui>=3.12",
    "pandas>=2.2",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "qrcode>=7.4",
    "plotly>=5.20",
    "psutil>=5.9",
    # Windows on ARM runs the x64 Python under emulation: Polars' default runtime needs AVX2 and its CPU check
    # fails there; the "compat" runtime (SSE4.2 only) is preferred automatically when installed.
    "polars-runtime-compat==1.44.2; sys_platform == 'win32'",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
# Only install pre-built packages (wheels): never build a package from source during installation, so no package code
# runs at install time. All packages in uv.lock have wheels for Windows, macOS and Linux.
no-build = true
# Use uv's own Python build, not a system/Microsoft-Store Python (Store Python behaves differently with the
# Windows firewall and app sandboxing). uv downloads it once during setup.
python-preference = "only-managed"
# Supply-chain cooldown: only package versions that have been public for at least a week when locking.
# Freshly published (possibly compromised) releases are usually found and removed within days.
exclude-newer = "2026-10-04T00:00:00Z"
# exception: NiceGUI 3.18.0 contains a security fix (GHSA-9mxh-cwxr-cxjj, ui.upload; not used here, but kept current)
exclude-newer-package = { nicegui = "2026-10-08T00:00:00Z" }

[tool.pytest.ini_options]
markers = ["slow: runs the solver"]
pythonpath = ["."]
